spring.application.name=subscription-service
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Bound readiness pool waits and avoid maintaining/pinging idle Neon connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:0}

# All scheduled workers; startup migrations/backfill and HTTP requests still run.
app.scheduling.enabled=${BACKGROUND_WORKERS_ENABLED:true}
app.reminders.enabled=${REMINDERS_ENABLED:true}
app.reminders.cron=${REMINDERS_CRON:0 */5 * * * ?}
app.notification-retry.enabled=${NOTIFICATION_RETRY_ENABLED:true}
app.notification-retry.delay-ms=${NOTIFICATION_RETRY_DELAY_MS:60000}
app.notification-retry.initial-delay-ms=${NOTIFICATION_RETRY_INITIAL_DELAY_MS:30000}
app.inbound-email.processing-enabled=${INBOUND_EMAIL_PROCESSING_ENABLED:true}
app.inbound-email.processing-delay-ms=${INBOUND_EMAIL_PROCESSING_DELAY_MS:30000}
app.inbound-email.processing-initial-delay-ms=${INBOUND_EMAIL_PROCESSING_INITIAL_DELAY_MS:15000}
app.inbound-email.retention-enabled=${INBOUND_EMAIL_RETENTION_ENABLED:true}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

google.client.id=${GOOGLE_CLIENT_ID}

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:subtrak-api}
jwt.audience=${JWT_AUDIENCE:subtrak-web}

app.sendgrid.apiKey=${SENDGRID_API_KEY:}
app.sendgrid.fromEmail=${SENDGRID_FROM_EMAIL:}
app.sendgrid.fromName=${SENDGRID_FROM_NAME:}
app.sendgrid.eventWebhookPublicKey=${SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY:}
app.email.outbound-provider=${EMAIL_OUTBOUND_PROVIDER:sendgrid}
app.email.sendgrid-inbound-enabled=${SENDGRID_INBOUND_ENABLED:true}
app.email.ses-consumers-enabled=${SES_CONSUMERS_ENABLED:false}
app.email.ses.region=${SES_REGION:${AWS_REGION:ap-south-1}}
app.email.ses.from-email=${SES_FROM_EMAIL:}
app.email.ses.from-name=${SES_FROM_NAME:}
app.email.ses.configuration-set=${SES_CONFIGURATION_SET:}
app.email.ses.inbound-queue-url=${SES_INBOUND_QUEUE_URL:}
app.email.ses.event-queue-url=${SES_EVENT_QUEUE_URL:}
app.email.ses.inbound-bucket=${SES_INBOUND_BUCKET:}
app.email.ses.event-poll-delay-ms=${SES_EVENT_POLL_DELAY_MS:1000}
app.email.ses.event-poll-initial-delay-ms=${SES_EVENT_POLL_INITIAL_DELAY_MS:5000}
app.email.ses.inbound-poll-delay-ms=${SES_INBOUND_POLL_DELAY_MS:1000}
app.email.ses.inbound-poll-initial-delay-ms=${SES_INBOUND_POLL_INITIAL_DELAY_MS:5000}
app.public-api-url=${PUBLIC_API_URL:http://localhost:8080}
app.inbound-email.domain=${INBOUND_EMAIL_DOMAIN:inbound.subtrak.me}
app.inbound-email.token-encryption-key=${INBOUND_EMAIL_TOKEN_ENCRYPTION_KEY:}
app.inbound-email.webhook-public-key=${SENDGRID_INBOUND_WEBHOOK_PUBLIC_KEY:}
app.inbound-email.max-request-bytes=${INBOUND_EMAIL_MAX_REQUEST_BYTES:10485760}
app.inbound-email.max-field-bytes=${INBOUND_EMAIL_MAX_FIELD_BYTES:1048576}
app.inbound-email.max-parts=${INBOUND_EMAIL_MAX_PARTS:30}
app.inbound-email.content-retention-days=${INBOUND_EMAIL_CONTENT_RETENTION_DAYS:30}
app.inbound-email.retention-batch-size=${INBOUND_EMAIL_RETENTION_BATCH_SIZE:100}
app.inbound-email.retention-cron=${INBOUND_EMAIL_RETENTION_CRON:0 15 * * * *}

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}

app.frontend.origins=${FRONTEND_ORIGINS:https://localhost:5173,https://subtrak-sable.vercel.app}
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:None}
app.frontend.base-url=${FRONTEND_BASE_URL:https://localhost:5173}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
